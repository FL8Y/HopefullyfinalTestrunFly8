name: FLY8 Android CI and Review Cadence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly8-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: Build, audit, and review reminders
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full history for cadence checks
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"

      - name: Prepare pinned virtualization engine
        run: python3 scripts/prepare_virtual_engine.py

      - name: Run FLY8 source invariant audit
        run: python3 scripts/audit_project.py

      - name: Compute commit review cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          anchor="$(tr -d '[:space:]' < docs/COMMIT_CADENCE_ANCHOR.txt)"
          git cat-file -e "${anchor}^{commit}"
          count="$(git rev-list --count HEAD "^$anchor")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          memory_due=false
          blueprint_due=false
          if (( count > 0 && count % 6 == 0 )); then memory_due=true; fi
          if (( count > 0 && count % 9 == 0 )); then blueprint_due=true; fi
          echo "memory_review_due=$memory_due" >> "$GITHUB_OUTPUT"
          echo "blueprint_refresh_due=$blueprint_due" >> "$GITHUB_OUTPUT"

          {
            echo "## FLY8 review cadence"
            echo ""
            echo "- Commits after cadence anchor: **$count**"
            echo "- Six-commit source/memory review due: **$memory_due**"
            echo "- Nine-commit guide refresh due: **$blueprint_due**"
            echo ""
            echo "Reminder only: read the source, inspect recent diffs, review the matrix and validate runtime behavior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Six-commit guide and memory review checkpoint
        if: steps.cadence.outputs.memory_review_due == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/review
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/FL8Y/readthischatgpt/main/here%20is%20your%20guiding%20prompt"             --output build/review/guiding-prompt-six-commit.txt
          test -s build/review/guiding-prompt-six-commit.txt
          test "$(grep -Ec '^#{1,3} ' build/review/guiding-prompt-six-commit.txt)" -ge 70
          {
            echo "## REQUIRED SIX-COMMIT REVIEW"
            echo ""
            echo "The complete external guide was fetched. Read the artifact, all 76 matrix rows, the reference map, the last six diffs, and the latest Actions failure details before further architecture changes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload six-commit review guide
        if: steps.cadence.outputs.memory_review_due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fly8-six-commit-review-guide
          path: build/review/guiding-prompt-six-commit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Nine-commit full blueprint refresh
        if: steps.cadence.outputs.blueprint_refresh_due == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/review
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/FL8Y/readthischatgpt/main/here%20is%20your%20guiding%20prompt"             --output build/review/guiding-prompt-nine-commit.txt
          test -s build/review/guiding-prompt-nine-commit.txt
          test "$(grep -Ec '^#{1,3} ' build/review/guiding-prompt-nine-commit.txt)" -ge 70
          {
            echo "## REQUIRED NINE-COMMIT BLUEPRINT REFRESH"
            echo ""
            echo "Read the full guide artifact before starting new architecture work. Compare every row in the 76-item matrix against current code and test evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nine-commit blueprint
        if: steps.cadence.outputs.blueprint_refresh_due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fly8-nine-commit-blueprint
          path: build/review/guiding-prompt-nine-commit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fly8-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Android runtime smoke test (API ${{ matrix.api-level }})
    needs: build-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 36]
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: fly8-debug-apk
          path: build/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch FLY8 on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -u
            mkdir -p build/emulator-smoke
            activity_log="build/emulator-smoke/activities-api-${{ matrix.api-level }}.txt"
            runtime_log="build/emulator-smoke/runtime-api-${{ matrix.api-level }}.log"
            start_log="build/emulator-smoke/start-api-${{ matrix.api-level }}.txt"

            if ! adb install -r build/apk/app-debug.apk; then
              adb logcat -d > "$runtime_log" || true
              echo "APK installation failed on API ${{ matrix.api-level }}." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            adb logcat -c || true
            start_output="$(adb shell am start -W -n com.fl8y.lightcloner/.MainActivity 2>&1)"
            start_result=$?
            printf '%s\n' "$start_output" > "$start_log"
            sleep 15
            app_pid="$(adb shell pidof com.fl8y.lightcloner 2>/dev/null | tr -d '\r' || true)"
            adb shell dumpsys activity activities > "$activity_log" 2>&1 || true
            adb logcat -d -s AndroidRuntime:E FLY8.VirtualRuntime:I FLY8.VirtualAppEngine:V FLY8.Diagnostics:V > "$runtime_log" 2>&1 || adb logcat -d > "$runtime_log"

            if [ "$start_result" -ne 0 ] || [ -z "$app_pid" ]; then
              echo "API ${{ matrix.api-level }}: FLY8 host process did not remain alive after launch." >> "$GITHUB_STEP_SUMMARY"
              cat "$start_log" "$runtime_log"
              exit 1
            fi
            if ! grep -E 'mResumedActivity|topResumedActivity' "$activity_log" | grep -q 'com.fl8y.lightcloner'; then
              echo "API ${{ matrix.api-level }}: FLY8 MainActivity was not found as the resumed Activity." >> "$GITHUB_STEP_SUMMARY"
              cat "$activity_log" "$runtime_log"
              exit 1
            fi
            if grep -q 'FATAL EXCEPTION' "$runtime_log"; then
              cat "$runtime_log"
              exit 1
            fi
            echo "API ${{ matrix.api-level }}: host Activity/process launch passed. Engine logs were captured; guest UI/render/task parity is not asserted by this smoke test." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly8-emulator-smoke-api-${{ matrix.api-level }}
          path: build/emulator-smoke/
          if-no-files-found: warn
          retention-days: 14
